<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Historique des courses</title>
<link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body class="page-history">

<header class="topbar sticky">
  <button id="btn-back" class="btn btn-ghost btn-small" type="button">← Course</button>
  <h1>Historique</h1>
  <span style="width:80px"></span>
</header>

<div class="wrap">
  <section id="totals" class="totals" hidden></section>
  <main id="runs"><p class="empty">Chargement…</p></main>
</div>

<div id="detail" class="sheet" role="dialog" aria-modal="true" aria-labelledby="detail-title" hidden>
  <header class="topbar sticky">
    <button id="detail-close" class="btn btn-ghost btn-small" type="button">← Retour</button>
    <h2 id="detail-title"></h2>
    <span style="width:80px"></span>
  </header>
  <div id="detail-map"></div>
  <div class="wrap">
    <section id="detail-stats" class="detail-grid"></section>

    <section class="card">
      <h3>Profil d'altitude</h3>
      <canvas id="profile"></canvas>
      <p id="profile-empty" class="muted" hidden>Pas de données d'altitude pour cette course.</p>
    </section>

    <section class="card" id="splits-section">
      <h3>Temps au kilomètre</h3>
      <table class="splits">
        <thead><tr><th>Km</th><th>Allure</th><th></th><th>D+</th></tr></thead>
        <tbody id="splits-body"></tbody>
      </table>
    </section>

    <div class="detail-actions">
      <button id="detail-gpx" class="btn" type="button">Exporter GPX</button>
      <button id="detail-delete" class="btn btn-danger" type="button">Supprimer</button>
    </div>
  </div>
</div>

<script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
<script src="js/common.js"></script>
<script src="js/historique.js"></script>
</body>
</html>
