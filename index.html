<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Application Course</title>
<link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body class="page-run" data-state="idle">

<header class="topbar">
  <h1>Application Course</h1>
  <span id="gps-badge" class="gps-badge" data-level="search">GPS…</span>
</header>

<main id="map-container">
  <div id="map"></div>
  <button id="btn-geoloc" class="map-btn active" type="button" title="Me recentrer" aria-label="Me recentrer">📍</button>
  <select id="style-select" aria-label="Fond de carte">
    <option value="mapbox/streets-v12">Streets</option>
    <option value="mapbox/outdoors-v12">Outdoors</option>
    <option value="mapbox/light-v11">Light</option>
    <option value="mapbox/dark-v11">Dark</option>
    <option value="mapbox/satellite-v9">Satellite</option>
    <option value="mapbox/satellite-streets-v12">Satellite Streets</option>
  </select>
  <button id="btn-sound" class="map-btn" type="button" aria-label="Annonces vocales" aria-pressed="true">🔊</button>
</main>

<section id="stats">
  <div id="chrono" class="num">00:00:00</div>
  <div class="stats-grid">
    <div class="stat main"><span class="v num" id="s-dist">0.00</span><span class="l">km</span></div>
    <div class="stat main"><span class="v num" id="s-pace">--:--</span><span class="l">allure /km</span></div>
    <div class="stat"><span class="v num" id="s-avgpace">--:--</span><span class="l">allure moy.</span></div>
    <div class="stat"><span class="v num" id="s-speed">0.0</span><span class="l">km/h moy.</span></div>
    <div class="stat"><span class="v num" id="s-gain">0</span><span class="l">D+ (m)</span></div>
    <div class="stat"><span class="v num" id="s-effort">0.00</span><span class="l">km-effort/h</span></div>
  </div>
</section>

<nav id="controls">
  <button id="btn-start" class="btn btn-big" type="button">Start</button>
  <button id="btn-historique" class="btn btn-ghost" type="button">Historique</button>
  <button id="btn-pause" class="btn" type="button">Pause</button>
  <button id="btn-stop" class="btn btn-danger" type="button">Stop</button>
</nav>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
<script src="js/common.js"></script>
<script src="js/run.js"></script>
</body>
</html>
